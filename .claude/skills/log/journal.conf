# This repo's journal settings for journal.sh, beside it. The repo owns this file: updating the
# script never touches it. Every key is optional; the values below are the defaults, commented out.
# One key=value per line.

# The followup journal, relative to the repo root.
# file=docs/cursor.md

# The date line journal.sh bumps on every write: `bold` is a `**Last updated**: YYYY-MM-DD` line,
# `frontmatter` a `last-updated:` field in the file's leading `---` block.
# date=bold

# `no`: journal writes are not committed on their own; they ride in the commit of the change that
# prompted them, and `journal.sh commit` only says so.
# commit=yes

# The commit subject prefix for journal writes: "<subject>: <what changed>".
# subject=cursor

# Followups not re-read within this many days are listed by `journal.sh review` and raised by
# /catchup: an entry's review date is the later of its captured date and its newest
# "Re-checked YYYY-MM-DD" note. Off when absent; for example:
# review_days=60
