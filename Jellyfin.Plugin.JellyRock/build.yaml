overview: "Server-side companion for the JellyRock Roku app: cast to a closed Roku, Play On remote control on HTTPS servers, and fast cleanup when the app is closed during playback."
imageUrl: "https://jellyrock.github.io/jellyfin-plugin-jellyrock/jellyrock.png"
description: >
  The server-side companion for the JellyRock Roku app. Cold-launch cast: cast from the
  Jellyfin web or mobile app to a Roku even when JellyRock is closed; the plugin lists
  the closed Roku as a "Play On" target and opens the item on it (http and https;
  JellyRock v2.24.0 or newer). Remote control on HTTPS: Roku cannot open a secure socket
  (wss://), so on an HTTPS server the plugin carries Play On casting and play, pause and
  seek from your phone to an open JellyRock (v2.23.0 or newer). Fast cleanup on HTTPS
  (v2.23.0 or newer): when you press Home on the Roku mid-video, the app cannot tell the server it stopped,
  so the session and its transcode linger for 5-10 minutes. The plugin detects the
  closed app within about a minute and stops it. On servers before Jellyfin 12.0 it
  also saves the resume point where you stopped, where Jellyfin alone would move it
  minutes ahead. On plain HTTP, remote control and cleanup need no plugin.
category: "General"
owner: "Charles Ewert"
