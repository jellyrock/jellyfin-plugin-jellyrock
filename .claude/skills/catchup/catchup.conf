# This repo's own reader for catchup-state.sh, beside it. The repo owns this file: updating the
# script never touches it. Every key is optional; with none set, no own reader runs.
# One key=value per line. The line format the reader prints is in catchup-state.sh's header.

# The command that prints this repo's own state, run with bash -c from the repo root. It may read
# the network, never write. Keep a long command in a script file and name that here.
# reader=bash scripts/catchup-state.sh

# Seconds before the reader is stopped and shown as an error.
# reader_timeout=30

# One line per id the reader prints on a BANNER line: its class, one of fire (on fire: a failing
# deploy, CI or pipeline), resume (in-flight work to pick up), overdue (past a date or a cap) or
# debt (drift, smells). Within a class, this file's line order is the order. FIX, INFO and CAVEAT
# lines need no class.
# class.deploy-failed=fire
# class.ci-failing=fire

reader=bash scripts/catchup-state.sh
class.ci-failing=fire
class.server-abi-issue=fire
class.pr-stuck=overdue
