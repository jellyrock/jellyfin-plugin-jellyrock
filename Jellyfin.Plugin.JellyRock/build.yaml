description: "The server-side companion for the JellyRock Roku app. Cast from another Jellyfin app: Cast from a Jellyfin app on your phone or browser to an open JellyRock, then pause, seek and skip from there. Needed on HTTPS servers, with JellyRock 2.23.0 or newer. Cast while JellyRock is closed: Cast from a Jellyfin app to your Roku while JellyRock is closed, when your server is on the same network as the Roku. Needed on HTTP and HTTPS servers, with JellyRock 2.24.0 or newer. Fast cleanup after you press Home: Press Home on your Roku mid-playback and your server ends the session within a minute instead of 5 to 10 minutes. Needed on HTTPS servers, with JellyRock 2.23.0 or newer. SyncPlay (watch together): Watch together in a Jellyfin SyncPlay group, and the group stops waiting on your Roku once you close JellyRock. Needed on HTTPS servers, with JellyRock 3.3.0 or newer."
