name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  # No paths filter on PRs: these jobs are required checks on main, and GitHub leaves a
  # required check Pending forever when a filter skips its workflow, so a docs-only PR
  # could never merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-parity:
    name: Version parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Backstop for review finding #6: the assembly version (Directory.Build.props)
      # and the manifest version (build.yaml) must agree. scripts/set-version.sh
      # writes both together; this fails the build if they ever drift.
      - name: Check version parity
        run: ./scripts/check-version-parity.sh

  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JellyRock.sln

      # Build enforces the analyzer suite (StyleCop + MultithreadingAnalyzer + AllEnabledByDefault)
      # with TreatWarningsAsErrors — this is the mechanical review gate.
      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyRock.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.JellyRock.Tests/Jellyfin.Plugin.JellyRock.Tests.csproj -c Release --no-build --verbosity normal

  server-abi:
    name: Server compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # The newest release of every server line from the targetAbi floor up
      # (docs/dev/README.md, "Server compatibility check"). `shell: bash` runs with
      # pipefail, so a failed listing fails the step.
      - name: Resolve the supported server releases
        id: servers
        shell: bash
        run: |
          list=$(./scripts/check-server-abi.sh --list | tr "\n" " ")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "key=$(tr " " "_" <<<"$list")" >> "$GITHUB_OUTPUT"

      # A published release never changes, so the cache is keyed on the release list:
      # it is saved again only when Jellyfin ships a release.
      - name: Cache Jellyfin releases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/jellyfin-plugin-jellyrock/servers
          key: jellyfin-servers-${{ steps.servers.outputs.key }}10.10.7
          restore-keys: jellyfin-servers-

      - name: Check the plugin binds to every supported server line
        env:
          SERVERS: ${{ steps.servers.outputs.list }}
        run: |
          read -ra servers <<<"$SERVERS"
          ./scripts/check-server-abi.sh "${servers[@]}"

      # The control: 10.10 lacks the 10.11 User entity the plugin binds to, so this must
      # fail. If it ever passes, the check has stopped seeing breaks.
      - name: Check the plugin does not bind below the floor
        run: ./scripts/check-server-abi.sh --no-build --expect-fail 10.10.7
